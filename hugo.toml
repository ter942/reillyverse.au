baseURL = "https://reillyverse.au"

# This is a "one page"-website, so we do not need these kinds of pages...
disableKinds = ["section", "taxonomy", "term", "RSS", "robotsTXT"]

defaultContentLanguage = "en"

theme = "hugo-scroll"

# The browser tab name
title = "Thomas Reilly - Experienced Sysadmin & Network Engineer"

enableEmoji = true

[params]
    favicon = "images/favicon.png"

    # Image used for link previews (Open Graph / Twitter cards).
    # The header background image is set in content/*/_index.md.
    images = ["images/pexels-cookiecutter-1148820.jpg"]

    # Partially transparent box behind the header title/subtitle
    title_guard = true

    # Used as og:site_name
    title = "Thomas Reilly - Experienced Sysadmin & Network Engineer"

    description = "Thomas Reilly - Experienced Sysadmin & Network Engineer"

    language_menu = true
    show_current_lang = true

    copyright = "© Thomas Reilly"

    hidedesignbyline = false

    invertSectionColors = false

    image_options = "webp q90 lanczos photo"

    combine_page_and_site_title = false

    [params.footer]
    showContactIcons = false
    showFooterLinks = false

    [params.meta]
        keywords = "Thomas Reilly, Tom Reilly, sysadmin, systems administrator, network administrator, network engineer, Sydney, IT infrastructure, Proxmox, homelab"

    [[params.contacts]]
        label = "email"
        value = "ter@tomreilly.net"
        url = "mailto:ter@tomreilly.net"
        icon = "fa fa-envelope"

    [[params.contacts]]
        label = "GitHub"
        value = "https://github.com/ter942"
        url = "https://github.com/ter942"
        icon = "fa-brands fa-github"

[languages]
  [languages.en]
    weight = 10
    languageName = "English"
    contentDir = "content/en"
  [languages.jp]
    weight = 20
    languageName = "日本語"
    contentDir = "content/jp"
